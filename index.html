<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>График смен</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f2f8;
    color: #222;
}

.app {
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

h1 {
    text-align: center;
}

.card {
    background: white;
    padding: 18px;
    border-radius: 16px;
    margin-bottom: 15px;
}

.point {
    background: #f1ebf7;
    padding: 15px;
    border-radius: 12px;
    margin: 8px 0;
    cursor: pointer;
    font-size: 17px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 15px;
}

.purple {
    background: #8e63c7;
    color: white;
}

.gray {
    background: #eeeeee;
}

.calendar {
    background: white;
    border-radius: 16px;
    padding: 10px;
}

.weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 13px;
    font-weight: bold;
}

.days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
}

.day {
    min-height: 100px;
    border: 1px solid #e5e5e5;
    padding: 5px;
    cursor: pointer;
}

.day-number {
    font-weight: bold;
    margin-bottom: 5px;
}

.employee {
    background: #e7d8f7;
    border-radius: 6px;
    padding: 3px;
    font-size: 11px;
    margin-top: 3px;
}

.empty-day {
    background: #fafafa;
}

.modal-background {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.modal {
    background: white;
    width: 100%;
    max-width: 400px;
    max-height: 90vh;
    border-radius: 18px;
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
}
#modalEmployees {
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    margin-bottom: 10px;
}
.employee-choice {
    padding: 12px;
    background: #f3eef8;
    border-radius: 10px;
    margin: 7px 0;
    cursor: pointer;
}

.selected {
    background: #cfaef5;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="app">

<h1>🗓️ График смен</h1>

<div id="homeScreen">

<div class="card">

<h2>📍 Выберите точку</h2>

<div id="pointsList"></div>

<button class="purple" onclick="addPoint()">
＋ Добавить точку
</button>

</div>

<div class="card">

<h2>👥 Сотрудники</h2>

<div id="employeesList"></div>

<button class="purple" onclick="addEmployee()">
＋ Добавить сотрудника
</button>

</div>

</div>

<div id="calendarScreen" style="display:none">

<button class="gray" onclick="goHome()">
← Точки
</button>

<h2 id="pointTitle"></h2>
<div class="month-nav">
    <button class="gray" onclick="previousMonth()">←</button>
    <h2 id="monthTitle"></h2>
    <button class="gray" onclick="nextMonth()">→</button>
</div>

<div class="calendar">

<div class="weekdays">
<div>ПН</div>
<div>ВТ</div>
<div>СР</div>
<div>ЧТ</div>
<div>ПТ</div>
<div>СБ</div>
<div>ВС</div>
</div>

<div id="days" class="days"></div>

</div>

</div>

</div>


<div id="modalBackground" class="modal-background">

<div class="modal">

<h2 id="modalDate"></h2>

<p><b>Кто работает?</b></p>

<div id="modalEmployees"></div>

<button class="gray" onclick="closeModal()">
Отмена
</button>

<button class="purple" onclick="saveShift()">
Сохранить
</button>

</div>

</div>


<script>const SUPABASE_URL = "https://qurvfafwikiasaoxsbfr.supabase.co";

const SUPABASE_KEY = "sb_publishable_ydyKuXf6PIb5al-E9-Nuhw_WD56TiaF";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
SUPABASE_KEY
);

let points = [];
let pointRows = [];

let employees = [];
let employeeRows = [];

let shifts = JSON.parse(localStorage.getItem("shifts")) || {};

let selectedPoint = null;

let currentDate = new Date();

let selectedDateKey = null;

let selectedEmployees = [];


async function loadPointsFromSupabase() { const { data, error } = await supabaseClient .from("points") .select("*") .order("name");
if (error) {
    alert("Ошибка загрузки точек: " + error.message);
    return;
}

pointRows = data || [];
points = pointRows.map(point => point.name);

renderHome();
}
async function loadEmployeesFromSupabase() { const { data, error } = await supabaseClient .from("employees") .select("*") .order("name");
if (error) {
    alert("Ошибка загрузки сотрудников: " + error.message);
    return;
}

employeeRows = data || [];
employees = employeeRows.map(employee => employee.name);

renderHome();
}
    function saveData() {

localStorage.setItem("points", JSON.stringify(points));

localStorage.setItem("employees", JSON.stringify(employees));

localStorage.setItem("shifts", JSON.stringify(shifts));

}


function renderHome() {

let pointsList = document.getElementById("pointsList");

let employeesList = document.getElementById("employeesList");

pointsList.innerHTML = "";

employeesList.innerHTML = "";


for (let i = 0; i < points.length; i++) {

pointsList.innerHTML +=
'<div class="point">' +

'<span onclick="openPoint(' + i + ')">' +
'📍 ' + points[i] +
'</span>' +

'<br><br>' +

'<button class="gray" onclick="editPoint(' + i + ')">' +
'✏️ Изменить' +
'</button> ' +

'<button class="gray" onclick="deletePoint(' + i + ')">' +
'🗑 Удалить' +
'</button>' +

'</div>';

}


for (let i = 0; i < employees.length; i++) {

employeesList.innerHTML +=
'<div class="employee-choice">' +

'👤 ' + employees[i] +

'<br><br>' +

'<button class="gray" onclick="editEmployee(' + i + ')">' +
'✏️ Изменить' +
'</button> ' +

'<button class="gray" onclick="deleteEmployee(' + i + ')">' +
'🗑 Удалить' +
'</button>' +

'</div>';

}


if (employees.length === 0) {

employeesList.innerHTML =
"<p>Сотрудников пока нет</p>";

}

}


async function addPoint() { let name = prompt("Введите название точки:");
if (name && name.trim()) {
    const { data, error } = await supabaseClient
        .from("points")
        .insert({ name: name.trim() })
        .select()
        .single();

    if (error) {
        alert("Ошибка добавления точки: " + error.message);
        return;
    }

    pointRows.push(data);
    points.push(data.name);

    renderHome();
}
}
function editPoint(index) {

let name = prompt(
"Изменить название точки:",
points[index]
);

if (name && name.trim()) {

let oldName = points[index];

let newName = name.trim();

points[index] = newName;

if (shifts[oldName]) {

shifts[newName] = shifts[oldName];

delete shifts[oldName];

}

saveData();

renderHome();

}

}


async function deletePoint(index) { if ( confirm( "Удалить точку «" + points[index] + "»?" ) ) { const pointId = pointRows[index].id;
    const { error } = await supabaseClient
        .from("points")
        .delete()
        .eq("id", pointId);

    if (error) {
        alert("Ошибка удаления точки: " + error.message);
        return;
    }

    points.splice(index, 1);
    pointRows.splice(index, 1);

    renderHome();
}
}

async function addEmployee() { let name = prompt("Введите имя сотрудника:");
if (name && name.trim()) {
    const { data, error } = await supabaseClient
        .from("employees")
        .insert({ name: name.trim() })
        .select()
        .single();

    if (error) {
        alert("Ошибка добавления сотрудника: " + error.message);
        return;
    }

    employeeRows.push(data);
    employees.push(data.name);

    renderHome();
}

}

function editEmployee(index) {

let oldName = employees[index];

let newName = prompt(
"Изменить имя сотрудника:",
oldName
);

if (newName && newName.trim()) {

newName = newName.trim();

employees[index] = newName;

for (let point in shifts) {

for (let date in shifts[point]) {

shifts[point][date] =
shifts[point][date].map(function(name) {

return name === oldName
? newName
: name;

});

}

}

saveData();

renderHome();

}

}


async function deleteEmployee(index) { let name = employees[index];
if (
    confirm(
        "Удалить сотрудника «" +
        name +
        "»?"
    )
) {
    const employeeId = employeeRows[index].id;

    const { error } = await supabaseClient
        .from("employees")
        .delete()
        .eq("id", employeeId);

    if (error) {
        alert("Ошибка удаления сотрудника: " + error.message);
        return;
    }

    employees.splice(index, 1);
    employeeRows.splice(index, 1);

    for (let point in shifts) {
        for (let date in shifts[point]) {
            shifts[point][date] =
                shifts[point][date].filter(function(employee) {
                    return employee !== name;
                });
        }
    }

    renderHome();
}
}

function openPoint(index) {

selectedPoint = points[index];

document.getElementById("homeScreen").style.display = "none";

document.getElementById("calendarScreen").style.display = "block";

document.getElementById("pointTitle").innerText =
selectedPoint;

renderCalendar();

}


function goHome() {

document.getElementById("calendarScreen").style.display = "none";

document.getElementById("homeScreen").style.display = "block";

renderHome();

}


function previousMonth() {

currentDate.setMonth(currentDate.getMonth() - 1);

renderCalendar();

}


function nextMonth() {

currentDate.setMonth(currentDate.getMonth() + 1);

renderCalendar();

}
function renderCalendar() {

let year = currentDate.getFullYear();
let month = currentDate.getMonth();

let months = [
"Январь",
"Февраль",
"Март",
"Апрель",
"Май",
"Июнь",
"Июль",
"Август",
"Сентябрь",
"Октябрь",
"Ноябрь",
"Декабрь"
];

document.getElementById("monthTitle").innerText =
months[month] + " " + year;

let daysContainer =
document.getElementById("days");

daysContainer.innerHTML = "";

let firstDay =
new Date(year, month, 1).getDay();

if (firstDay === 0) {
firstDay = 7;
}

let daysInMonth =
new Date(year, month + 1, 0).getDate();


for (let i = 1; i < firstDay; i++) {

daysContainer.innerHTML +=
'<div class="day empty-day"></div>';

}


for (let day = 1; day <= daysInMonth; day++) {

let dateKey =
year + "-" +
String(month + 1).padStart(2, "0") +
"-" +
String(day).padStart(2, "0");


let employeesForDay = [];


if (
shifts[selectedPoint] &&
shifts[selectedPoint][dateKey]
) {

employeesForDay =
shifts[selectedPoint][dateKey];

}


let html =
'<div class="day" onclick="openDay(\'' +
dateKey +
'\')">' +

'<div class="day-number">' +
day +
'</div>';


for (
let i = 0;
i < employeesForDay.length;
i++
) {

html +=
'<div class="employee">👤 ' +
employeesForDay[i] +
'</div>';

}


html += '</div>';


daysContainer.innerHTML += html;

}

}


function openDay(dateKey) {

selectedDateKey = dateKey;

selectedEmployees = [];


if (
shifts[selectedPoint] &&
shifts[selectedPoint][dateKey]
) {

selectedEmployees =
shifts[selectedPoint][dateKey].slice();

}


let parts = dateKey.split("-");


document.getElementById("modalDate").innerText =
"📅 " +
parts[2] + "." +
parts[1] + "." +
parts[0];


renderEmployeeChoices();


document.getElementById(
"modalBackground"
).style.display = "flex";

}


function renderEmployeeChoices() {

let container =
document.getElementById("modalEmployees");

container.innerHTML = "";


if (employees.length === 0) {

container.innerHTML =
"<p>Сначала добавьте сотрудников.</p>";

return;

}


for (let i = 0; i < employees.length; i++) {

let employee = employees[i];

let className =
"employee-choice";


if (selectedEmployees.includes(employee)) {

className += " selected";

}


container.innerHTML +=
'<div class="' +
className +
'" onclick="toggleEmployee(' +
i +
')">👤 ' +
employee +
'</div>';

}

}


function toggleEmployee(index) {

let employee = employees[index];


if (selectedEmployees.includes(employee)) {

selectedEmployees =
selectedEmployees.filter(function(name) {

return name !== employee;

});

} else {

selectedEmployees.push(employee);

}


renderEmployeeChoices();

}


async function saveShift() {
const pointRow = pointRows.find(
    point => point.name === selectedPoint
);

if (!pointRow) {
    alert("Ошибка: точка не найдена.");
    return;
}

const pointId = pointRow.id;

// Удаляем старые смены этой точки на эту дату
const { error: deleteError } = await supabaseClient
    .from("shifts")
    .delete()
    .eq("point_id", pointId)
    .eq("shift_date", selectedDateKey);

if (deleteError) {
    alert("Ошибка удаления старой смены: " + deleteError.message);
    return;
}

// Если сотрудники выбраны — создаём новые записи
if (selectedEmployees.length > 0) {

    const shiftRecords = selectedEmployees
        .map(name => {
            const employee = employeeRows.find(
                emp => emp.name === name
            );

            if (!employee) return null;

            return {
                point_id: pointId,
                employee_id: employee.id,
                shift_date: selectedDateKey
            };
        })
        .filter(record => record !== null);

    const { error: insertError } = await supabaseClient
        .from("shifts")
        .insert(shiftRecords);

    if (insertError) {
        alert("Ошибка сохранения смены: " + insertError.message);
        return;
    }
}

// Пока обновляем и старый объект, чтобы календарь сразу показал изменения
if (!shifts[selectedPoint]) {
    shifts[selectedPoint] = {};
}

shifts[selectedPoint][selectedDateKey] =
    selectedEmployees;

closeModal();
renderCalendar();
}

function closeModal() {

document.getElementById(
"modalBackground"
).style.display = "none";

}
async function loadShiftsFromSupabase() {
const { data, error } = await supabaseClient
    .from("shifts")
    .select("*");

if (error) {
    console.error("Ошибка загрузки смен:", error.message);
    return;
}

shifts = {};

data.forEach(function(shift) {

    const point = pointRows.find(function(p) {
        return p.id === shift.point_id;
    });

    const employee = employeeRows.find(function(e) {
        return e.id === shift.employee_id;
    });

    if (!point || !employee) return;

    if (!shifts[point.name]) {
        shifts[point.name] = {};
    }

    if (!shifts[point.name][shift.shift_date]) {
        shifts[point.name][shift.shift_date] = [];
    }

    shifts[point.name][shift.shift_date].push(employee.name);

});

renderCalendar();
}

async function startApp() {
    await loadPointsFromSupabase();
    await loadEmployeesFromSupabase();
    await loadShiftsFromSupabase();
}

startApp();
</script>

</body>

</html>
